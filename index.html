<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For You ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffb6c1, #ffe6ea);
      font-family: "Segoe UI", Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .card {
      max-width: 500px;
      background: rgba(255,255,255,0.85);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
      color: #b30059;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.1rem;
      color: #444;
      margin-bottom: 25px;
    }

    button {
      padding: 14px 28px;
      font-size: 1.1rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      background: #ff4d88;
      color: white;
      margin: 10px;
    }

    .secondary {
      background: #999;
    }

    .message {
      color: #b30059;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="card" id="app"></div>

<script>
  const app = document.getElementById("app");

  // SCREEN 1 — Romantic message
  function screenOne() {
    app.innerHTML = `
      <h1>Hey you🤍😘</h1>
      <p>
        I don’t always say this out loud, but you genuinely make my days
        brighter. Your smile, your kindness, the way you exist — it all
        means more to me than you probably realize.
        <br><br>
        I feel lucky, calm, and happy just knowing you’re mine. I love you very much mero maya🤍❤️
      </p>
      <button onclick="screenTwo()">Mero maya lai euta kura sodhna man thyo…</button>
    `;
  }

  // SCREEN 2 — Soft gate
  function screenTwo() {
    app.innerHTML = `
      <h1>Sodham?</h1>
      <button onclick="screenThree()">Yes</button>
      <button class="secondary" onclick="wrongAnswer()">No</button>
      <div class="message" id="msg"></div>
    `;
  }

  function wrongAnswer() {
    document.getElementById("msg").innerText =
      "Wrong answer. Mero dil nadukhau naa. Chocolate kindinchu. Please click yes😘";
    app.querySelector(".secondary").remove();
  }

  // SCREEN 3 — Valentine question
  function screenThree() {
    app.innerHTML = `
      <h1>Will you be my Valentine? 💖</h1>
      <button onclick="yesFinal()">Yes 💕</button>
      <button class="secondary" onclick="noFinal()">No 🙄</button>
      <div class="message" id="finalMsg"></div>
    `;
  }

  function noFinal() {
    document.getElementById("finalMsg").innerHTML =
      "I refuse your refusal. 😌<br>Too bad you are already my Valentine.<br>Now deal with it 😘";
  }

  function yesFinal() {
    app.innerHTML = `
      <h1>Yayyyy!!! ❤️🥰</h1>
      <p>You just made me the happiest person alive🤍❤️ I love you very muchhh😘😘</p>
    `;
  }

  // Start
  screenOne();
</script>

</body>
</html>
